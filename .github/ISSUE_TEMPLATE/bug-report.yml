name: Bug report or other issue
description: Something else that isn't working as expected
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, what you expected, and the code or steps to reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CrawlerDetect and PHP version
      placeholder: "v1.3.x on PHP 8.4"
