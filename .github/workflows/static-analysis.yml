name: Static Analysis

permissions:
  contents: read

on:
  push:
    branches:
      - "master"
  pull_request:

jobs:
  phpstan:
    runs-on: ubuntu-24.04
    name: PHPStan

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PHPStan is installed via setup-php rather than require-dev because
      # it needs PHP >= 7.4, while the test matrix still installs dev
      # dependencies on PHP 7.2.
      - name: Setup PHP, with composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          tools: composer:v2, phpstan
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run PHPStan
        run: phpstan analyse --no-progress
