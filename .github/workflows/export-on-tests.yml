name: Export after tests

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["Test"]
    types:
      - completed
    branches: [ master ]
  workflow_dispatch:

jobs:
  run-export:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0

    - name: Set up PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.1'
        extensions: mbstring

    - name: Run export script
      run: php export.php

    - name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      with:
        commit_message: "Run export.php — update exported data [skip ci]"
